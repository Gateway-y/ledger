version: "3.8"

# Local development stack: Postgres + Formance Ledger (community edition, pinned).
# Platform services run with `go run ./cmd/<service>` against this stack.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data

  ledger:
    image: ghcr.io/formancehq/ledger:v2.2.30
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      BIND: 0.0.0.0:3068
    ports:
      - "3068:3068"

volumes:
  pg_data:
